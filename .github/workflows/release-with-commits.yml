name: Release Notes with Commit Messages

on:
  release:
    types: [created]

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get latest tag before release
        id: previous_tag
        run: |
          git fetch --tags
          # Get previous tag before the new one
          PREV_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1))
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Gather commit messages since previous tag
        id: commit_messages
        run: |
          git fetch --tags
          # Get current release tag from GitHub context
          CURR_TAG="${GITHUB_REF##*/}"
          # If previous tag found, get commits between tags
          if [ -n "${{ steps.previous_tag.outputs.prev_tag }}" ]; then
            COMMITS=$(git log --pretty=format:"* %s" ${{ steps.previous_tag.outputs.prev_tag }}..$CURR_TAG)
          else
            # If no previous tag, get all commits up to current tag
            COMMITS=$(git log --pretty=format:"* %s" $CURR_TAG)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update release notes with commit messages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## Commits since previous release:
            ${{ steps.commit_messages.outputs.commits }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}name: Release

on:
  push:
    branches:
      - main  # Change to your default branch name

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
