name: Release with PR Commit Messages

on:
  push:
    tags:
      - 'v*'   # Runs when you push a version tag like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get last merged PR for the tag
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const ref = process.env.GITHUB_REF;
            const tag = ref.replace('refs/tags/', '');

            // Get the commit SHA for the tag
            const { data: tagData } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            });
            const commit_sha = tagData.object.sha;

            // Find the PR merged at this commit
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              sort: "updated",
              direction: "desc",
              per_page: 30
            });
            const pr = prs.find(pr => pr.merge_commit_sha === commit_sha);
            if (!pr) {
              core.setFailed("No merged PR found for this tag commit SHA.");
              return;
            }
            core.setOutput("number", pr.number);

      - name: Get all commit messages from PR
        id: commits
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = steps.pr.outputs.number;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            const messages = commits.map(c => `- ${c.commit.message}`).join('\n');
            core.setOutput('messages', messages);

      - name: Create GitHub Release with PR Commit Messages
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.commits.outputs.messages }}
          draft: false
          prerelease: false
